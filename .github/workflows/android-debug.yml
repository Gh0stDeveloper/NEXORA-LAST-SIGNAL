name: Android Debug Build

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "src/**"
      - "VERSION"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.3"

jobs:
  android-debug:
    name: Build installable ARM64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2.4.2
        with:
          version: "4.6.3"
          use-dotnet: false
          include-templates: true

      - name: Configure Android SDK paths for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF2

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export unsigned ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --verbose --headless --path . --export-debug "Android Debug" build/android/NEXORA-LAST-SIGNAL-debug-unsigned.apk
          test -s build/android/NEXORA-LAST-SIGNAL-debug-unsigned.apk

      - name: Sign APK with ephemeral CI key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore /tmp/nexora-last-signal-debug.keystore \
            -storepass android \
            -keypass android \
            -alias nexora-last-signal-debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=NEXORA LAST SIGNAL Debug,O=Ghost Developer,C=MX"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks /tmp/nexora-last-signal-debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/android/NEXORA-LAST-SIGNAL-debug.apk \
            build/android/NEXORA-LAST-SIGNAL-debug-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs build/android/NEXORA-LAST-SIGNAL-debug.apk
          test -s build/android/NEXORA-LAST-SIGNAL-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-LAST-SIGNAL-android-debug
          path: build/android/NEXORA-LAST-SIGNAL-debug.apk
          if-no-files-found: error
          retention-days: 14
